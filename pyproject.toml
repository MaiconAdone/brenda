[project]
name = "lupa-cidada"
version = "0.0.1"
description = "Plataforma aberta e auditável de detecção de indícios de irregularidade em contratações públicas, usando somente dados públicos."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "httpx>=0.27",
    "tenacity>=8.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
ui = ["streamlit>=1.38"]
orquestracao = ["dagster>=1.8", "dagster-webserver>=1.8"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lupa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Textos em português usam acentos e "–" legitimamente.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["lupa"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "dagster.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient`",
]
